[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Credenziali API GME — aggiornate dopo cambio password GME
[build.environment]
  GME_USERNAME = "madesrls3274"
  GME_LOGIN    = "madesrls3274"
  GME_PASSWORD = "Gioia04052019!"

[functions]
  node_bundler = "esbuild"

[functions."getPunPsv"]
  timeout = 30

[[edge_functions]]
  path    = "/pun-oggi/"
  function = "pun-seo"

# Pagina partner esterno — nascosta da motori di ricerca e AI crawlers
[[headers]]
  for = "/energia-automatica/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Headers per sicurezza e performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache per assets statici
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache per immagini
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www a non-www
[[redirects]]
  from = "https://www.semplicom.com/*"
  to = "https://semplicom.com/:splat"
  status = 301
  force = true

# API prezzi energia GME (PUN + PSV)
[[redirects]]
  from = "/api/public/pun-psv"
  to = "/.netlify/functions/getPunPsv"
  status = 200
  force = true

# Redirect /sitemap → /sitemap.xml (Google Search Console)
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

# 404 fallback — restituisce 404 reale (evita soft-404 per Google)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
